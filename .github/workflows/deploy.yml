name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

# 同一ブランチで連続pushされた場合、古いデプロイジョブを自動キャンセルしてリソースを節約
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Nuxt & Vite build cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache
            .nuxt/cache
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'server/**', 'nuxt.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nuxt-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Checks and Build in Parallel
        run: |
          pnpm format
          pnpm lint
          
          echo "Starting Typecheck, Test, and Build in parallel..."
          pnpm typecheck &
          PID_TYPE=$!
          
          pnpm test &
          PID_TEST=$!
          
          pnpm build:cf &
          PID_BUILD=$!
          
          wait $PID_TYPE && wait $PID_TEST && wait $PID_BUILD

      - name: Deploy to Cloudflare Pages
        run: pnpm deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
