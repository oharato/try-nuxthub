name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"

# 同一ブランチで連続pushされた場合、古いデプロイジョブを自動キャンセルしてリソースを節約
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint, typecheck, test in parallel
        run: |
          pnpm format
          pnpm lint &
          PID_LINT=$!

          pnpm typecheck &
          PID_TYPE=$!

          pnpm test &
          PID_TEST=$!

          wait $PID_LINT && wait $PID_TYPE && wait $PID_TEST

  build:
    name: Build for Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Nuxt & Vite build cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache
            .nuxt/cache
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'server/**', 'nuxt.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nuxt-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        run: pnpm build:cf

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-bundle
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-bundle
          path: dist

      - name: Cache npm & npx
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npx-cache-wrangler

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=try-nuxthub --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
