name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

# 同一ブランチで連続pushされた場合、古いデプロイジョブを自動キャンセルしてリソースを節約
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Nuxt & Vite build cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache
            .nuxt/cache
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'server/**', 'nuxt.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nuxt-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code (format, lint, typecheck, test)
        run: pnpm check

      - name: Build for Cloudflare Pages
        run: pnpm build:cf

      - name: Deploy to Cloudflare Pages
        run: pnpm deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
